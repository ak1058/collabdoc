spring:
  application:
    name: collabdoc


  profiles:
    active: dev

  # Database Configuration (
  datasource:
    url: jdbc:postgresql://localhost:5432/collabdoc_db
    username: postgres # Your custom username
    password: password  # Your custom password
    driver-class-name: org.postgresql.Driver

  #  JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  #  Redis Configuration
  data:
    redis:
      host: 172.18.78.79
      port: 6379

  # 6. Mail Configuration
  mail:
    host: smtp.example.com # Replace with your SMTP server (e.g., Gmail, SendGrid)
    port: 587
    username: your.email@example.com # Your sender email address
    password: your-app-password # Your application-specific password (not primary password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

#  Web Request Logging
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

#  Custom Application Properties
app:
  jwt-secret: "sampel-secretkey"
  jwt-expiration-ms: 86400000 # 24 hours

